name: consumer
description: Santha consumer app — shop the whole town in one app.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  santha_api: any
  santha_core: any
  santha_ui: any
  santha_offline: any
  geolocator: ^14.0.2
  path_provider: ^2.1.5
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dio: ^5.8.0

flutter:
  uses-material-design: true
  generate: true
