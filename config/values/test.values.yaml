# Santha — TEST environment. Non-secret settings only, committed.
# Secrets (JWT, database URL, provider keys…) live in the server's .env / secret manager: see secrets.md.
# Read by: the backend (SANTHA_ENV=test), infra/deploy/santha.sh (deploy section), the deploy workflow (web)
# and the apps-release workflow (apps).
environment: test

# Server and HTTPS (infra/deploy)
deploy:
  apiDomain: api.test.santhaapp.com
  webDomain: test.santhaapp.com
  # Public address of the storage container (photo uploads use signed URLs, so phones must reach it)
  mediaDomain: media.test.santhaapp.com
  robotsTag: noindex            # keep the test site out of search engines
  composeProfiles: localdb,storage   # Postgres and S3 storage run on the test VM itself

# Backend process (keys are env var names in camelCase: appEnv → APP_ENV)
backend:
  appEnv: staging
  nodeEnv: production
  logLevel: info
  trustProxy: 1                 # Caddy in front
  corsOrigins: https://test.santhaapp.com
  webBaseUrl: https://test.santhaapp.com
  # Test providers: fixed OTP for testers, mock KYC, Razorpay TEST mode (rzp_test_ keys in .env)
  otpProvider: mock
  mockOtpCode: "123456"
  # WhatsApp login OTP (ADR-017, docs/integrations/whatsapp-otp.md). The flag whatsapp_otp is on by default; with
  # the mock provider the code goes nowhere and 123456 works. To try real WhatsApp delivery on test, uncomment these and put WHATSAPP_ACCESS_TOKEN in the server's .env. With a live channel the fixed code
  # above no longer applies: real codes arrive on WhatsApp (or by SMS as the fallback).
  # whatsappProvider: cloud
  # whatsappPhoneNumberId: "123456789012345"
  # whatsappOtpTemplate: santha_login_otp
  # To force SMS instead: flagOverrides: '{"whatsapp_otp":false}'
  kycProvider: mock
  paymentsProvider: razorpay_sandbox
  pushProvider: mock
  mapsProvider: mock
  barcodeProvider: openfoodfacts
  s3Endpoint: https://media.test.santhaapp.com
  s3Region: ap-south-1
  s3Bucket: santha-test

# Website image build (NEXT_PUBLIC_*; fixed at build time)
web:
  siteUrl: https://test.santhaapp.com
  apiUrl: https://api.test.santhaapp.com
  mediaOrigin: https://media.test.santhaapp.com

# Flutter apps: flavor stg → "Santha Test", "Santha Partner Test", "Santha Rider Test"
apps:
  flavor: stg
  apiBaseUrl: https://api.test.santhaapp.com
