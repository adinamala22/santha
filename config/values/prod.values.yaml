# Santha — PRODUCTION. Non-secret settings only, committed.
# Secrets live in the server's .env / secret manager: see secrets.md. The backend refuses to start in
# production with mock OTP, mock KYC or non-live payments.
# Host-specific settings (storage endpoint, region…) can go in an overlay: <cloud>.prod.values.yaml,
# selected with SANTHA_CLOUD (e.g. gcp.prod.values.yaml).
environment: prod

deploy:
  apiDomain: api.santhaapp.com
  webDomain: santhaapp.com
  mediaDomain: ""               # production uses a managed bucket, no storage container
  robotsTag: all
  composeProfiles: ""           # managed Postgres and bucket: no extra containers

backend:
  appEnv: production
  nodeEnv: production
  logLevel: info
  trustProxy: 1
  corsOrigins: https://santhaapp.com
  webBaseUrl: https://santhaapp.com
  otpProvider: msg91
  kycProvider: digio
  paymentsProvider: razorpay
  pushProvider: fcm
  mapsProvider: google
  barcodeProvider: openfoodfacts
  # Default storage: DigitalOcean Spaces, Bangalore (India). Overlays replace these for other hosts.
  s3Endpoint: https://blr1.digitaloceanspaces.com
  s3Region: ap-south-1
  s3Bucket: santha-production

web:
  siteUrl: https://santhaapp.com
  apiUrl: https://api.santhaapp.com
  mediaOrigin: https://blr1.digitaloceanspaces.com   # photos are served path-style: <endpoint>/<bucket>/…

apps:
  flavor: prod
  apiBaseUrl: https://api.santhaapp.com
  # Raster map tiles for the apps ({z}/{x}/{y}); empty = OpenStreetMap's public server (testing only, ADR-007).
  mapTilesUrl: ""
  # Push (FCM, ADR-027): the Firebase project's Android apps (Firebase console → Project settings → Your apps).
  # Not secret (they ship inside the app). Empty = the apps build without push.
  firebase:
    projectId: ""
    senderId: ""
    apiKey: ""
    appIds:
      consumer: ""
      merchant: ""
      rider: ""
