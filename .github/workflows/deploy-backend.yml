name: Deploy · Backend

# Backend pipeline (API, worker, migrations), separate from the website and the apps (ADR-024).
#   QA (test):         every push to main that touches the backend: build the images (tagged with the commit), deploy.
#   PROD (production): run by hand: Actions → "Deploy · Backend" → Run workflow → PROD. Leave the tag empty to
#                      promote exactly what QA runs now; the same images are used, no rebuild.
# Settings: config/values/<env>.values.yaml. Server setup: docs/deploy/README.md.
on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - config/values/**
      - infra/deploy/**
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/deploy-backend.yml
      - .github/workflows/deploy-env.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: ['PROD (production)', 'QA (test)']
        default: 'PROD (production)'
      tag:
        description: Commit SHA to deploy (40 characters, built by a push to main). Empty = what QA runs now.
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Skipped until the servers are set up (repository variable DEPLOY_ENABLED=true), so main stays green meanwhile.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    name: build backend images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Images for x86 and ARM servers (the AWS test/prod server is ARM).
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: backend (API + worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: tools (migrations, scripts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: tools
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-tools:${{ github.sha }}
          cache-from: type=gha,scope=backend

  qa:
    name: QA
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: test, component: backend, tag: '${{ github.sha }}' }
    secrets: inherit

  manual:
    name: ${{ startsWith(inputs.environment, 'PROD') && 'PROD' || 'QA' }}
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: ${{ startsWith(inputs.environment, 'PROD') && 'prod' || 'test' }}
      component: backend
      tag: ${{ inputs.tag }}
    secrets: inherit
