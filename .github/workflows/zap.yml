name: zap-baseline

# DAST: OWASP ZAP baseline (passive) scans of the public site and the API against the fake service.
# The full active scan and the external pen test run against staging before launch (docs/launch/launch-checklist.md).
on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 08:30 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web sync:brand
      - name: Start the fake service (backend + web)
        run: |
          pnpm dev:fake > fake.log 2>&1 &
          for i in $(seq 1 120); do curl -sf localhost:4000/v1/health && curl -sf -o /dev/null localhost:3000 && break; sleep 2; done
      - name: ZAP baseline — web
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          rules_file_name: .github/zap-rules.tsv
          cmd_options: -a
      - name: ZAP API scan — OpenAPI
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:4000/docs/openapi.json
          format: openapi
          allow_issue_writing: false
          rules_file_name: .github/zap-rules.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: zap-reports, path: 'report_*', retention-days: 14 }
