name: deploy

# Every push to main: build the images (tagged with the commit) and deploy them to TEST.
# Prod: run this workflow by hand (Run workflow → environment: prod, tag: a commit already checked on test).
# The same images are used, with no rebuild.
# Settings come from config/values/<env>.values.yaml. Setup: docs/deploy/README.md.
on:
  push:
    branches: [main]
    paths: [apps/backend/**, apps/web/**, packages/shared-types/**, design/**, config/values/**, infra/deploy/**, pnpm-lock.yaml, .github/workflows/deploy.yml, .github/workflows/deploy-env.yml]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [prod, test]
        default: prod
      tag:
        description: Commit SHA to deploy (all 40 characters; it must have been built by a push to main)
        required: true

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'test' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Skipped until the servers are set up (repository variable DEPLOY_ENABLED=true), so main stays green meanwhile.
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the values files
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          for env in test prod; do
            for k in siteUrl apiUrl mediaOrigin; do
              echo "${env}_${k}=$(yq ".web.${k} // \"\"" "config/values/${env}.values.yaml")" >> "$GITHUB_OUTPUT"
            done
          done
      # Images for x86 (e.g. a Hostinger VPS) and ARM (e.g. Oracle Cloud Always Free) servers.
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: backend (API + worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: tools (migrations, scripts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: tools
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-tools:${{ github.sha }}
          cache-from: type=gha,scope=backend
      - name: web (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-web-test:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.v.outputs.test_siteUrl }}
            NEXT_PUBLIC_API_URL=${{ steps.v.outputs.test_apiUrl }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ steps.v.outputs.test_mediaOrigin }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: web (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-web-prod:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.v.outputs.prod_siteUrl }}
            NEXT_PUBLIC_API_URL=${{ steps.v.outputs.prod_apiUrl }}
            NEXT_PUBLIC_MEDIA_ORIGIN=${{ steps.v.outputs.prod_mediaOrigin }}
          cache-from: type=gha,scope=web

  test:
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: test, tag: '${{ github.sha }}' }
    secrets: inherit

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: '${{ inputs.environment }}', tag: '${{ inputs.tag }}' }
    secrets: inherit
