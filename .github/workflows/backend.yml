name: backend

on:
  pull_request:
    paths: [apps/backend/**, packages/shared-types/**, pnpm-lock.yaml, .github/workflows/backend.yml]
  push:
    branches: [main]
    paths: [apps/backend/**, packages/shared-types/**, pnpm-lock.yaml, .github/workflows/backend.yml]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend lint
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend test:unit
      - name: OpenAPI and shared-types are up to date
        run: |
          pnpm openapi:gen
          git diff --exit-code -- apps/backend/openapi.json packages/shared-types packages/santha_api/openapi.json
      - run: pnpm --filter @santha/shared-types typecheck

  fake:
    name: fake-mode acceptance (DATA_STORE=memory · no Docker)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test:fake
      - name: End-to-end walkthrough over HTTP (scripts/walkthrough.mjs)
        run: |
          (cd apps/backend && DATA_STORE=memory node -r @swc-node/register src/dev/fake-main.ts > ../../fake.log 2>&1 &)
          pnpm walkthrough || (tail -50 fake.log; exit 1)

  integration:
    name: integration (Testcontainers · Postgres+PostGIS · Redis)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test:int
