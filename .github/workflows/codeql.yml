name: codeql

# SAST: CodeQL for the TypeScript backend and web app. Dart is not supported by CodeQL; `flutter analyze` runs in flutter.yml.
on:
  pull_request:
    paths: [apps/backend/**, apps/web/**, packages/shared-types/**, .github/workflows/codeql.yml]
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * 1' # Mondays 08:00 IST

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths: [apps/backend/src, apps/web/app, apps/web/components, apps/web/lib]
            paths-ignore: ['**/*.spec.ts', '**/*.test.ts', apps/backend/src/dev]
      - uses: github/codeql-action/analyze@v3
