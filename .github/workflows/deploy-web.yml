name: Deploy · Web

# Website pipeline (landing, store pages, ops console), separate from the backend and the apps (ADR-024).
#   QA (test):         every push to main that touches the website: build ONE image (ADR-025: the addresses are
#                      runtime settings from config/values/<env>.values.yaml web section), deploy it to QA.
#   PROD (production): run by hand: Actions → "Deploy · Web" → Run workflow → PROD. Leave the tag empty to promote
#                      exactly what QA runs now: the very same image.
# The website needs its environment's backend: deploy the backend to that environment first.
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/shared-types/**
      - packages/santha_ui/fonts/**
      - design/**
      - config/values/**
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/deploy-web.yml
      - .github/workflows/deploy-env.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: ['PROD (production)', 'QA (test)']
        default: 'PROD (production)'
      tag:
        description: Commit SHA to deploy (40 characters, built by a push to main). Empty = what QA runs now.
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    name: build web image (all environments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.v.outputs.registry }}/santha-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  qa:
    name: QA
    needs: images
    uses: ./.github/workflows/deploy-env.yml
    with: { environment: test, component: web, tag: '${{ github.sha }}', skip_if_older: true }
    secrets: inherit

  manual:
    name: ${{ startsWith(inputs.environment, 'PROD') && 'PROD' || 'QA' }}
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: ${{ startsWith(inputs.environment, 'PROD') && 'prod' || 'test' }}
      component: web
      tag: ${{ inputs.tag }}
    secrets: inherit
